[package]
name = "hp-protocol"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
aes = { version = "0.8", features = ["zeroize"] }
md-5 = "0.10"
sha1 = "0.11"
rand = "0.8"
num-bigint = "0.4"
subtle = "2"
zeroize = "1"
flate2 = "1"
plist = "1"
uuid = { version = "1", features = ["v4"] }
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }
