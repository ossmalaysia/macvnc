[package]
name = "macvnc-app"
version = "0.1.5"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "MacVNC High Performance Screen Sharing client"

[build-dependencies]
winresource = "0.1.31"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
aes-gcm = "0.10"
zeroize = "1"
tempfile = "3"

anyhow = "1"
hp-protocol = { path = "../hp-protocol" }
hp-media = { path = "../hp-media" }
