name: Native Rust release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag and reviewed source
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected vMAJOR.MINOR.PATCH tag' }
          $manifest = Get-Content rust/crates/macvnc-app/Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"\s*$').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match app version' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must belong to main' }
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: ./scripts/build-rust.ps1 -Package
        shell: pwsh
      - name: Validate native decoder and archive portable package
        shell: pwsh
        run: |
          $env:MACVNC_FFMPEG_DIR = Join-Path $pwd 'dist/macvnc-rust'
          cargo test -p hp-media --test native_decode --locked -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Native decoder test failed' }
          Compress-Archive -Path dist/macvnc-rust -DestinationPath dist/macvnc-rust-windows-x64.zip -Force
      - name: Build Windows installer
        run: ./scripts/build-installer.ps1
        shell: pwsh
      - name: Checksums
        shell: pwsh
        run: |
          # The in-app updater reads the zip line; the installer lines let people verify downloads.
          $files = @('macvnc-rust-windows-x64.zip') + @(Get-ChildItem dist/MacVNC-Setup-*win-x64.exe | Select-Object -ExpandProperty Name)
          $files | ForEach-Object { (Get-FileHash (Join-Path dist $_) -Algorithm SHA256).Hash.ToLower() + "  $_" } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: |
            dist/macvnc-rust-windows-x64.zip
            dist/MacVNC-Setup-*win-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      # No checkout, repository scripts, package execution or PR artifacts here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3; repository-approved pin
        with:
          files: |
            release/MacVNC-Setup-*win-x64.exe
            release/macvnc-rust-windows-x64.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          body: |
            Experimental native Rust HP client for Windows x64.
            Developed by Anchor Sprint — https://anchorsprint.com

            Install: download MacVNC-Setup-win-x64.exe and run it. It installs for your Windows user only (no administrator prompt) with Start menu and desktop shortcuts and an uninstaller in Settings → Apps.
            Portable: extract macvnc-rust-windows-x64.zip and run macvnc-app.exe beside its DLLs.
            Permanent link to the newest installer: https://github.com/ossmalaysia/macvnc/releases/latest/download/MacVNC-Setup-win-x64.exe

            In-app updates: MacVNC checks for new stable releases at startup and every 12 hours, highlights Update in the toolbar, then downloads, verifies, installs and restarts on one click. Failed replacement or startup attempts rollback. Versions before 0.1.11 have no updater and need this download once.
            Experimental file copy: Files supports sending and receiving individual regular files over the authenticated Screen Sharing connection. Dropping a local file selects the upload source. Normal authenticated interoperability with a live Mac remains unverified; Finder/Explorer file clipboard and folders are not implemented.

            Unsigned build: Windows SmartScreen may warn on first run (More info → Run anyway). Native FFmpeg software HEVC decoding.
            Review the included license and source materials before use.
            Commercial/customization enquiries: oss@anchorsprint.com.
